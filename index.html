    <style>
        :root {
            --bg-main: #06080d;
            --bg-card: rgba(15, 19, 28, 0.85);
            --primary: #00f0ff;
            --primary-glow: rgba(0, 240, 255, 0.35);
            --accent-green: #00ff66;
            --accent-green-glow: rgba(0, 255, 102, 0.35);
            --accent-purple: #9d00ff;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border-line: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(157, 0, 255, 0.05) 0%, transparent 45%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Navbar Profesional */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 6%;
            background: rgba(6, 8, 13, 0.92);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-line);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.9rem;
            font-weight: 900;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .logo span {
            color: var(--primary);
            text-shadow: 0 0 12px var(--primary-glow);
        }

        .verified-badge {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }

        /* Buscador Superior */
        .search-box {
            position: relative;
            width: 380px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 22px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-line);
            border-radius: 25px;
            color: #fff;
            outline: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            background: rgba(255, 255, 255, 0.07);
        }

        /* Hero & Stats Counter */
        .hero {
            padding: 50px 6% 20px;
            text-align: center;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #ffffff 0%, #7a8a9e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.25rem;
            font-weight: 600;
            max-width: 700px;
            margin: 0 auto;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 35px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-line);
            padding: 12px 25px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Contenedor Principal de Filtros */
        .filter-section {
            max-width: 1500px;
            margin: 30px auto 0;
            padding: 0 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .categories-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-line);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        /* Grid de Juegos */
        .main-container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 30px 6% 100px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 28px;
        }

        /* Tarjeta de Juego Ultra-Profesional */
        .game-card {
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--border-line);
            overflow: hidden;
            backdrop-filter: blur(12px);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 15px 30px -10px var(--primary-glow);
        }

        .card-banner {
            position: relative;
            height: 200px;
            overflow: hidden;
            background: #0d111a;
        }

        .card-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.5s ease;
        }

        .game-card:hover .card-banner img {
            transform: scale(1.08);
        }

        .badge-mod {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--accent-green);
            color: #000;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 10px var(--accent-green-glow);
        }

        .badge-ver {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(6, 8, 13, 0.85);
            border: 1px solid var(--border-line);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 6px;
            color: #fff;
        }

        .mod-info {
            color: var(--accent-green);
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .meta-tags {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }

        .game-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .btn-download {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 12px 0;
            background: linear-gradient(135deg, var(--accent-green) 0%, #00b348 100%);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 8px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-download:hover {
            box-shadow: 0 4px 20px var(--accent-green-glow);
            transform: scale(1.02);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.3rem;
        }

        @media (max-width: 850px) {

            .search-box { width: 100%; }
            .hero h1 { font-size: 2.3rem; }
            .stats-bar { display: none; }
        }
    </style>
</head>

                            <span>📱 ${game.req}</span>
                        </div>
                        <p class="game-desc">${game.desc}</p>
                        <a href="${game.link}" target="_blank" rel="noopener noreferrer" class="btn-download">Descargar MOD APK</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Buscador Inteligente
        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = androidGames.filter(game => {
                const matchesSearch = game.title.toLowerCase().includes(query) || 
                                      game.mod.toLowerCase().includes(query) || 
                                      game.ver.toLowerCase().includes(query);
                const matchesCategory = selectedCategory === 'all' || game.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });
            renderGames(filtered);
        }

        // Cambio de Categorías
        function filterCategory(category, btn) {
            selectedCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterGames();
        }

        // Inicializar catálogo al cargar
        renderGames(androidGames);
    </script>
</body>
</html>
